name: Execute notebooks

'on':
  push:
  pull_request:
  workflow_dispatch:

jobs:
  notebooks:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.13'

      - uses: julia-actions/cache@v2

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install notebook runner
        run: python -m pip install --disable-pip-version-check jupyter nbconvert

      - name: Instantiate Julia environment
        run: julia --project=. -e 'using Pkg; Pkg.instantiate(); Pkg.precompile()'

      - name: Register Julia kernel
        run: julia --project=. -e 'using Pkg; Pkg.build("IJulia")'

      - name: Execute Japanese notebook
        run: >-
          jupyter nbconvert --to notebook --execute
          --ExecutePreprocessor.timeout=600
          --output-dir=/tmp/notebook-output
          short_intro_julia.ipynb

      - name: Execute English notebook
        run: >-
          jupyter nbconvert --to notebook --execute
          --ExecutePreprocessor.timeout=600
          --output-dir=/tmp/notebook-output
          short_intro_julia_en.ipynb
